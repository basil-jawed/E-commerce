<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Exclusive</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    .auth-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .auth-visual { background: linear-gradient(135deg, #0a0a0a, #1a1a2e); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 24px; padding: 60px; }
    .auth-visual-icon { font-size: 120px; }
    .auth-visual-title { font-size: 32px; font-weight: 800; color: #fff; text-align: center; }
    .auth-visual-desc { font-size: 14px; color: rgba(255,255,255,0.6); text-align: center; line-height: 1.8; }
    .auth-form-side { display: flex; align-items: center; justify-content: center; padding: 60px 40px; }
    .auth-form-box { width: 100%; max-width: 400px; }
    .auth-form-box h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .auth-form-box p { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; }
    .auth-input { width: 100%; border: none; border-bottom: 1px solid var(--border); padding: 12px 0; font-size: 14px; font-family: var(--font-main); margin-bottom: 24px; background: transparent; transition: var(--transition); }
    .auth-input:focus { border-bottom-color: var(--primary); outline: none; }
    .auth-input::placeholder { color: var(--text-muted); }
    .auth-btn { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: var(--font-main); transition: var(--transition); margin-bottom: 16px; }
    .auth-btn:hover { background: var(--primary-hover); }
    .auth-google-btn { width: 100%; padding: 14px; background: #fff; color: var(--text-primary); border: 1px solid var(--border); border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-main); display: flex; align-items: center; justify-content: center; gap: 12px; transition: var(--transition); margin-bottom: 24px; }
    .auth-google-btn:hover { background: var(--bg-light); }
    .auth-footer { text-align: center; font-size: 14px; color: var(--text-secondary); }
    .auth-footer a { color: var(--text-primary); font-weight: 600; text-decoration: underline; }
    .auth-tabs { display: flex; margin-bottom: 32px; border-bottom: 1px solid var(--border); }
    .auth-tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-size: 16px; font-weight: 600; border-bottom: 2px solid transparent; transition: var(--transition); }
    .auth-tab.active { border-bottom-color: var(--primary); color: var(--primary); }
    @media (max-width: 768px) { .auth-page { grid-template-columns: 1fr; } .auth-visual { display: none; } }
  </style>
</head>
<body>

<div class="auth-page">
  <!-- Visual Side -->
  <div class="auth-visual">
    <div class="auth-visual-icon">🛍️</div>
    <h2 class="auth-visual-title">Exclusive</h2>
    <p class="auth-visual-desc">Join millions of happy shoppers.<br/>Get 10% off your first order when you sign up today.</p>
    <div style="display:flex;gap:24px;text-align:center;">
      <div><div style="font-size:24px;font-weight:800;color:#fff;">10.5k+</div><div style="font-size:12px;color:rgba(255,255,255,0.5);">Sellers</div></div>
      <div><div style="font-size:24px;font-weight:800;color:#fff;">3M+</div><div style="font-size:12px;color:rgba(255,255,255,0.5);">Customers</div></div>
      <div><div style="font-size:24px;font-weight:800;color:#fff;">1M+</div><div style="font-size:12px;color:rgba(255,255,255,0.5);">Products</div></div>
    </div>
  </div>

  <!-- Form Side -->
  <div class="auth-form-side">
    <div class="auth-form-box">
      <div class="auth-tabs">
        <div class="auth-tab" id="login-tab" onclick="switchTab('login')">Log In</div>
        <div class="auth-tab active" id="signup-tab" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <!-- Sign Up Form -->
      <div id="signup-form">
        <h1>Create an account</h1>
        <p>Enter your details below</p>
        <form onsubmit="return false;">
          <input type="text" class="auth-input" placeholder="Name" />
          <input type="email" class="auth-input" placeholder="Email or Phone Number" />
          <input type="password" class="auth-input" placeholder="Password" />
          <button class="auth-btn">Create Account</button>
          <button class="auth-google-btn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Sign up with Google
          </button>
          <div class="auth-footer">Already have account? <a href="#" onclick="switchTab('login')">Log in</a></div>
        </form>
      </div>

      <!-- Log In Form -->
      <div id="login-form" style="display:none;">
        <h1>Log in to Exclusive</h1>
        <p>Enter your details below</p>
        <form onsubmit="return false;">
          <input type="email" class="auth-input" placeholder="Email or Phone Number" />
          <input type="password" class="auth-input" placeholder="Password" />
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <button class="auth-btn" style="width:auto;padding:14px 40px;margin:0;">Log In</button>
            <a href="#" style="color:var(--primary);font-size:13px;font-weight:500;">Forget Password?</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('login-tab').classList.toggle('active', tab === 'login');
  document.getElementById('signup-tab').classList.toggle('active', tab === 'signup');
}
</script>
</body>
</html>
